[project]
name = "dogcity"
version = "0.0.1"
description = "Backend API для обработки запросов предоставления услуг дог ситтеров."
readme = "README.md"
authors = [
    { name = "Кибирев Илья Владимирович", email = "kibirev.i@yandex.ru" }
]
requires-python = "==3.12.8"
dependencies = [
    "fastapi[standard]==0.141.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config --import-mode=importlib"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez — запрещает наивный datetime.now()
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific, в том числе сортировка __all__
]
ignore = [
    "RUF001",
    "RUF002",  # кириллица, похожая на латиницу, в докстрингах: проект на русском
    "RUF003",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations" = { msg = "запрещено конвенцией проекта" }

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
disallow_any_explicit = true
disallow_any_unimported = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool"]

[dependency-groups]
dev = [
    "factory-boy==3.3.3",
    "hypothesis==6.165.10",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.3",
]

